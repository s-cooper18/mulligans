[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mulligans"
version = "0.1.0"
description = "A Python project"
dependencies = ["attrs", "mtg-parser==0.0.1a55"]

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 112

# Specify Python version for compatibility
target-version = "py314"

# Select rulesets to enforce
# Common rule groups:
#   E/F = Pycodestyle (errors & warnings)
#   W = general warnings
#   I = import sorting
#   UP = pyupgrade rules (modernize code)
#   N = naming conventions
lint.select = ["E", "F", "W", "I", "UP"]

# Exclude certain paths (like virtualenvs or migrations)
exclude = ["venv", "__pycache__"]

# Show fixes when applying --fix
show-fixes = true

# Respect .gitignore patterns
respect-gitignore = true

# Enable incremental mode (optional, speeds up re-runs)
cache-dir = ".ruff_cache"

# This project was generated with 0.4.4 using template: https://github.com/beeware/briefcase-template @ v0.4.4
[tool.briefcase]
project_name = "Mulligans"
bundle = "s-cooper18.mulligans"
version = "0.0.1"
url = "https://mulligans.s-cooper18/mulligans"
license = "GPL-3.0+"
license-files = ["LICENSE"]
author = "Suzannah Cooper"
author_email = "suzannah.cooper@outlook.com"

[tool.briefcase.app.mulligans]
formal_name = "Mulligans"
description = "Command line mulligan app that handles Serum Powder"
long_description = """More details about the app should go here.
"""
sources = [
    "mulligans",
    "src"
]
test_sources = [
    "tests",
]
console_app = true

requires = ["attrs", "mtg-parser==0.0.1a55"]
test_requires = [
    "pytest",
]

